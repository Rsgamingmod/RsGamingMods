<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090711">
<title>RS Gaming Mod</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#090711;
  color:white;
  font-family:Arial,Helvetica,sans-serif;
}
header{
  text-align:center;
  padding:38px 12px 46px;
  border-bottom:1px solid #30243e;
  background:radial-gradient(ellipse at center,#211032 0%,#090711 75%);
}
.brand{
  font-size:clamp(30px,7vw,52px);
  font-weight:900;
  margin:0 0 24px;
  background:linear-gradient(90deg,#ff258b,#ff913b,#ffe04b,#36edcc,#25aaff,#d34dff,#ff258b);
  background-size:300% 100%;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  animation:rainbow 9s linear infinite;
}
@keyframes rainbow{to{background-position:300% 0}}
.tagline{font-size:clamp(15px,3.8vw,27px);color:#c7c2d4;margin:0 0 16px}
.subline{color:#c5bfd2;font-size:16px}
main{max-width:1100px;margin:auto;padding:32px 14px 50px}
.search{
  width:100%;padding:18px 20px;margin-bottom:38px;
  border:1px solid #514064;border-radius:25px;
  background:#151120;color:white;font-size:18px;
}
.search:focus{outline:1px solid #c54cff}
.games{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:26px;
}
.game-card{
  min-width:0;
  padding:24px 12px;
  border:1px solid #40314f;
  border-radius:30px;
  background:linear-gradient(160deg,#191629,#100e1b);
}
.game-title{
  text-align:center;font-size:clamp(21px,4.5vw,36px);
  margin:12px 0 30px;color:#00d9ff;font-weight:900;
}
.profile{
  display:block;width:100%;max-width:260px;
  aspect-ratio:1;object-fit:cover;
  margin:0 auto 30px;border-radius:24px;
  background:#171321;
}
.category{
  display:block;width:100%;min-height:138px;
  margin:20px 0;padding:20px 8px;
  border:4px solid transparent;border-radius:24px;
  background:
    linear-gradient(#100e1b,#100e1b) padding-box,
    linear-gradient(130deg,#e348fa,#a56bff,#00d9ff) border-box;
  color:#fff;font-size:clamp(13px,2.7vw,21px);
  font-weight:900;text-align:center;
  overflow-wrap:anywhere;cursor:pointer;
}
.category:hover{filter:brightness(1.2)}
.panel{
  margin-top:20px;padding:22px;
  border:1px solid #40314f;border-radius:22px;
  background:#151120;
}
.back{
  padding:12px 17px;border-radius:12px;
  background:#282039;color:white;
  border:1px solid #514064;cursor:pointer;
}
.page-title{text-align:center;font-size:clamp(23px,5vw,36px);overflow-wrap:anywhere}
.version{
  display:block;width:100%;padding:20px;margin-top:14px;
  border:2px solid #67427e;border-radius:15px;
  background:#21192e;color:white;text-align:center;
  font-size:20px;font-weight:bold;cursor:pointer;
}
.version:hover{border-color:#00d9ff}
.video{
  width:100%;aspect-ratio:16/9;
  border:0;border-radius:15px;background:#000;
  margin:12px 0 20px;
}
.download{
  display:block;max-width:360px;width:100%;
  margin:20px auto 0;padding:18px;
  border-radius:14px;text-align:center;
  background:linear-gradient(90deg,#00dcff,#39ffb0);
  color:#071018;font-size:22px;font-weight:900;
  text-decoration:none;
}
.download-note{text-align:center;color:#c7c2d4;font-size:12px}
.empty{text-align:center;color:#c7c2d4;padding:20px}
footer{text-align:center;padding:25px;color:#aaa0ba;font-size:13px}
[hidden]{display:none!important}
@media(max-width:360px){
  .games{gap:10px}
  .game-card{padding:18px 8px}
  .category{min-height:115px;font-size:12px;padding:12px 4px}
  .game-title{font-size:20px}
}
</style>
</head>

<body>
<header>
  <h1 class="brand">RS GAMING MOD</h1>
  <p class="tagline">Bussid &amp; Bussin Mods Easy And Fast Download</p>
  <div class="subline">Gaming Mods · Versions · Video · Downloads</div>
</header>

<main>
  <input id="search" class="search" type="search"
    placeholder="🔎 Search mods, categories, versions..."
    aria-label="Search mods">

  <section id="home">
    <div class="games">

      <div class="game-card">
        <h2 class="game-title">🚌 BUSSID</h2>

        <img class="profile"
          src="https://raw.githubusercontent.com/Rsgamingmod/RsGamingMods/main/unnamed%20(2).png"
          alt="BUSSID Profile"
          onerror="this.alt='BUSSID profile image unavailable'">

        <div class="category-list" data-game="bussid"></div>
      </div>

      <div class="game-card">
        <h2 class="game-title">🚌 BUSSIN</h2>

        <img class="profile"
          src="https://raw.githubusercontent.com/Rsgamingmod/RsGamingMods/main/unnamed%20(1).png"
          alt="BUSSIN Profile"
          onerror="this.alt='BUSSIN profile image unavailable'">

        <div class="category-list" data-game="bussin"></div>
      </div>

    </div>
  </section>

  <section id="results" hidden>
    <button class="back" onclick="goHome()">← HOME</button>
    <div id="resultContent"></div>
  </section>
</main>

<footer>RS Gaming Mod</footer>

<script>
const categories=[
  "REALISTIC RAIN 🌧️⛈️ MOD",
  "REALISTIC HEAD LIGHT MOD",
  "STEERING WHEEL MOD",
  "WHEEL CAP MOD",
  "GARAGE MOD"
];

/*
  ADD NEW MODS HERE.
  Each mod needs a unique ID.
  IDs appear in the URL but are not displayed as page text.
*/
const mods=[
  {
    id:"steering-wheel-v4-5-2",
    game:"bussid",
    category:"STEERING WHEEL MOD",
    version:"v4.5.2",
    name:"ASHOK LEYLAND STEERING WHEEL PACK",
    video:"7lbKLJHIqeo",
    download:"https://sharemods.com/1ysqyf4rvjgz/Bussid_V4.5.2_Top_4_Steering_Wheel_Mod.7z.html"
  },
  {
    id:"steering-wheel-v4-6",
    game:"bussid",
    category:"STEERING WHEEL MOD",
    version:"v4.6",
    name:"STEERING WHEEL MOD",
    video:"eZfmXlZqSEU",
    download:"https://sharemods.com/8yf6gh81ry69/ASHOK_LEYLAND_STEERING_WHEEL_PACK.7z.html"
  }
];

const $=id=>document.getElementById(id);

function esc(value){
  return String(value).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#39;"
  }[c]));
}

function slug(text){
  return text.toLowerCase()
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-|-$/g,"");
}

function goHome(){location.hash="/";}

function openCategory(game,category){
  location.hash="/category/"+game+"/"+slug(category);
}

function openMod(id){
  location.hash="/mod/"+encodeURIComponent(id);
}

function renderHome(){
  $("home").hidden=false;
  $("results").hidden=true;

  document.querySelectorAll(".category-list").forEach(list=>{
    const game=list.dataset.game;
    list.innerHTML=categories.map(category=>`
      <button class="category"
        data-game="${game}"
        data-category="${esc(category)}">
        ${esc(category)}
      </button>
    `).join("");
  });

  document.querySelectorAll("[data-category]").forEach(button=>{
    button.onclick=()=>openCategory(
      button.dataset.game,button.dataset.category
    );
  });
}

function showPage(html){
  $("home").hidden=true;
  $("results").hidden=false;
  $("resultContent").innerHTML=html;
}

function renderGame(game){
  showPage(`
    <div class="panel">
      <h2 class="page-title">${game.toUpperCase()}</h2>
      <div class="category-list" data-game="${game}"></div>
    </div>
  `);

  const list=document.querySelector("#resultContent .category-list");
  list.innerHTML=categories.map(category=>`
    <button class="category"
      data-game="${game}"
      data-category="${esc(category)}">
      ${esc(category)}
    </button>
  `).join("");

  list.querySelectorAll("[data-category]").forEach(button=>{
    button.onclick=()=>openCategory(
      button.dataset.game,button.dataset.category
    );
  });
}

function renderCategory(game,categorySlug){
  const category=categories.find(c=>slug(c)===categorySlug);
  if(!category)return notFound();

  const list=mods.filter(m=>
    m.game===game && m.category===category
  );

  const versions=[...new Set(list.map(m=>m.version))];

  showPage(`
    <div class="panel">
      <h2 class="page-title">${esc(category)}</h2>
      ${versions.length?versions.map(version=>`
        <button class="version" data-version="${esc(version)}">
          ${esc(version)}
        </button>
      `).join(""):'<p class="empty">No versions uploaded yet.</p>'}
    </div>
  `);

  document.querySelectorAll("[data-version]").forEach(button=>{
    button.onclick=()=>{
      const mod=list.find(m=>m.version===button.dataset.version);
      if(mod)openMod(mod.id);
    };
  });
}

function renderMod(id){
  const mod=mods.find(m=>m.id===id);
  if(!mod)return notFound();

  showPage(`
    <div class="panel">
      <h1 class="page-title">${esc(mod.name)}</h1>
      <p class="empty">
        ${mod.game.toUpperCase()} · ${esc(mod.category)} · ${esc(mod.version)}
      </p>

      <h2 class="page-title">WATCH FULL VIDEO</h2>
      <iframe class="video"
        src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(mod.video)}"
        title="Mod video"
        loading="lazy"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen></iframe>

      <a class="download"
        href="${esc(mod.download)}"
        target="_blank"
        rel="noopener noreferrer">DOWNLOAD</a>

      <p class="download-note">Click On Download</p>
    </div>
  `);
}

function notFound(){
  showPage(`
    <div class="panel">
      <h2 class="page-title">Page not found</h2>
      <p class="empty">Please return to the home page.</p>
      <button class="back" onclick="goHome()">← HOME</button>
    </div>
  `);
}

function route(){
  const parts=decodeURIComponent(location.hash.slice(1))
    .split("/").filter(Boolean);

  if(!parts.length)return renderHome();

  if(parts[0]==="game" &&
     ["bussid","bussin"].includes(parts[1])){
    return renderGame(parts[1]);
  }

  if(parts[0]==="category" &&
     ["bussid","bussin"].includes(parts[1]) && parts[2]){
    return renderCategory(parts[1],parts[2]);
  }

  if(parts[0]==="mod" && parts[1]){
    return renderMod(parts[1]);
  }

  notFound();
}

$("search").addEventListener("input",event=>{
  const query=event.target.value.trim().toLowerCase();

  if(!query){
    if(!location.hash || location.hash==="#/")renderHome();
    else route();
    return;
  }

  const matches=mods.filter(m=>
    [m.name,m.game,m.category,m.version]
      .join(" ").toLowerCase().includes(query)
  );

  showPage(`
    <h2 class="page-title">Search Results</h2>
    ${matches.length?matches.map(m=>`
      <button class="version" data-mod="${esc(m.id)}">
        ${esc(m.name)}<br>
        <small>${m.game.toUpperCase()} · ${esc(m.version)}</small>
      </button>
    `).join(""):'<p class="empty">No mods found.</p>'}
  `);

  document.querySelectorAll("[data-mod]").forEach(button=>{
    button.onclick=()=>openMod(button.dataset.mod);
  });
});

window.addEventListener("hashchange",route);
renderHome();
route();
</script>
</body>
  </html>
